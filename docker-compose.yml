x-minio-configuration: &minio-configuration
  MINIO_ROOT_USER: minio
  MINIO_ROOT_PASSWORD: password
  MINIO_HOST: minio

x-minio-storage-credentials: &minio-storage-credentials
  MINIO_ACCESS_KEY: fundamento
  MINIO_SECRET_KEY: IPaWkaUi9Ko1NA
  MINIO_URL: ${MINIO_URL:-http://localhost:9000}
  MINIO_INTERNAL_URL: http://minio:9000

x-rails-environment: &rails-environment
  SECRET_KEY_BASE: ${SECRET_KEY_BASE:-abcdef}
  DATABASE_URL: postgres://postgres:password@postgresql/postgres
  REDIS_URL: redis://redis
  RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
  HTTP_HOST: ${HTTP_HOST:-localhost:3000}
  RAILS_LOG_LEVEL: ${RAILS_LOG_LEVEL:-info}

services:
  postgresql:
    image: postgres:17
    environment:
      - POSTGRES_PASSWORD=password
    volumes:
      - postgres:/var/lib/postgresql/data
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 10s
      retries: 3
  redis:
    image: redis
    ports:
      - '${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 10s
      retries: 3
  # MinIO deleted its own images from Docker Hub (2026-09-11) and made the quay.io
  # mirrors private (2026-09-24), which broke `docker compose pull` everywhere. These
  # are Bitnami's archived builds of the same AGPL binaries -- the only drop-in left
  # that still speaks `mc admin`, which dockerfiles/minio-init.sh needs. The namespace
  # is frozen and will never be updated, so both are pinned by digest; this is a
  # stopgap until the object store is replaced (SeaweedFS/Garage/RustFS).
  #
  # Bitnami's entrypoint, not ours, builds the `minio server` argv -- it reads
  # MINIO_DATA_DIR / MINIO_API_PORT_NUMBER / MINIO_CONSOLE_PORT_NUMBER instead of
  # MINIO_VOLUMES, and defaults MINIO_BROWSER to off where upstream defaults it on.
  #
  # The server runs as uid 1001, so a `minio` volume left over from the old
  # root-owned image fails to start with "/bitnami/minio/data/.root_user:
  # Permission denied". It holds nothing but dev/e2e scratch data -- drop it once
  # (`docker volume rm fundamento-cloud_minio`) and it is recreated correctly. CI
  # starts from an empty volume every run and is unaffected.
  #
  # MINIO_SKIP_CLIENT is not cosmetic. Without it Bitnami's setup starts a throwaway
  # MinIO in the background to configure its own `mc` alias, then stops it before
  # starting the real server. The healthcheck below passes against that throwaway, so
  # Compose releases minio-initialization into the gap and `mc alias set` dies on
  # "connection refused". Skipping the client step removes the start/stop entirely;
  # we create buckets from minio-initialization, never from MINIO_DEFAULT_BUCKETS.
  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5@sha256:6dabb4a2088c9a79908de3bc05f4586c23ad2182c8908e7e3acbf61c1467fb20
    environment:
      <<: *minio-configuration
      MINIO_DATA_DIR: /bitnami/minio/data
      MINIO_BROWSER: 'on'
      MINIO_SKIP_CLIENT: 'yes'
    volumes:
      - minio:/bitnami/minio/data
    ports:
      - '${MINIO_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 5s
      timeout: 10s
      retries: 3
  minio-initialization:
    image: bitnamilegacy/minio-client:2025.7.21-debian-12-r3@sha256:73bd39f7899a0cef12b8dd5df13aa93a3ed1aaa44236542442e9ac76819ac158
    entrypoint: /bin/sh
    command: /minio-init.sh
    volumes:
      - ./dockerfiles/minio-init.sh:/minio-init.sh
    environment:
      <<: [*minio-configuration, *minio-storage-credentials]
      # Overriding the entrypoint skips Bitnami's setup, which is what normally gives
      # `mc` somewhere to write. The image runs as uid 1001 with HOME=/, which it
      # cannot write to, so point mc's config at a writable path explicitly.
      MC_CONFIG_DIR: /tmp/.mc
    depends_on:
      minio:
        condition: service_healthy
  website:
    build:
      context: ./
      target: ${RAILS_ENV:-production}
      args:
        - RAILS_ENV=${RAILS_ENV:-production}
      secrets:
        - fontawesome-auth
      # Layer cache for CI. Empty locally, so `bin/dev-e2e` builds exactly as before;
      # CI exports these to reuse the previous run's layers -- without them every run
      # does a cold `bundle install`, re-downloading the 17 MB Font Awesome Pro gem
      # from dl.fontawesome.com and burning the account's monthly bandwidth quota.
      cache_from:
        - ${BUILD_CACHE_FROM:-}
      cache_to:
        - ${BUILD_CACHE_TO:-}
    environment:
      <<: [*rails-environment, *minio-storage-credentials]
    ports:
      - '${RAILS_PORT:-3000}:3000'
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-initialization:
        condition: service_completed_successfully
  jobs:
    build:
      context: ./
      target: ${RAILS_ENV:-production}
      args:
        - RAILS_ENV=${RAILS_ENV:-production}
      secrets:
        - fontawesome-auth
      # Layer cache for CI. Empty locally, so `bin/dev-e2e` builds exactly as before;
      # CI exports these to reuse the previous run's layers -- without them every run
      # does a cold `bundle install`, re-downloading the 17 MB Font Awesome Pro gem
      # from dl.fontawesome.com and burning the account's monthly bandwidth quota.
      cache_from:
        - ${BUILD_CACHE_FROM:-}
      cache_to:
        - ${BUILD_CACHE_TO:-}
    command: bundle exec good_job start
    environment:
      <<: [*rails-environment, *minio-storage-credentials]
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-initialization:
        condition: service_completed_successfully

volumes:
  postgres:
  minio:

secrets:
  fontawesome-auth:
    file: dockerfiles/fontawesome-auth.secret