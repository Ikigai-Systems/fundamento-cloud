# Paths no test needs. Labels with no_check: true may skip them.
no_check: [".claude/**/*", "CLAUDE.md", "docs/**/*", "*.md", ".github/**/*"]
labels:
  skip-rspec:
    workflows: [run-tests.yaml]
    no_check: true
    skippable: ["spec/e2e/**/*"]
  skip-e2e:
    workflows: [run-e2e-tests.yaml]
    no_check: true
    skippable: ["spec/**/*"]
    except: ["spec/e2e/**/*", "spec/fixtures/**/*"]
  skip-deploy:
    workflows: [package-fundamento-cloud.yaml, package-fundamento-standalone.yaml]
    dockerignore: true
    # The production and standalone Dockerfile stages copy named folders from the build stage,
    # never spec/ (only the e2e stage does) or root Markdown, though both are in the context.
    skippable: ["spec/**/*", "*.md"]
