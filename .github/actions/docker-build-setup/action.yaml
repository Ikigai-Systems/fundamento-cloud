name: "Docker Build Setup"
description: "Common setup for Docker image builds: Buildx, registry login, timestamp, released version"
inputs:
  registry:
    description: "Container registry URL"
    required: false
    default: "ghcr.io"
  github-token:
    description: "GitHub token for registry authentication"
    required: true

outputs:
  timestamp:
    description: "Current UTC timestamp for tagging"
    value: ${{ steps.current-time.outputs.time }}
  released-version:
    description: >-
      The version from version.txt, but only when this commit is a release commit.
      Empty otherwise, so images are tagged with a semver only when that semver
      actually means something.
    value: ${{ steps.released.outputs.version }}

runs:
  using: "composite"
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to the Container registry
      uses: docker/login-action@v3
      with:
        registry: ${{ inputs.registry }}
        username: ${{ github.actor }}
        password: ${{ inputs.github-token }}

    - name: Get current time
      id: current-time
      uses: josStorer/get-current-time@v2

    # release-please owns version.txt and nothing else touches it, so a change there
    # marks the commit that turns master into a release. Only that image earns the
    # semver tag — tagging every master build would make `:1.2.0` a moving target for
    # anyone pinning it.
    - name: Detect released version
      id: released
      shell: bash
      run: |
        set -uo pipefail
        if [ ! -f version.txt ]; then
          echo "version=" >> "$GITHUB_OUTPUT"
          echo "no version.txt — skipping semver tag"
          exit 0
        fi
        # actions/checkout is shallow by default; one more commit is all we need.
        git fetch --deepen=1 --quiet 2>/dev/null || true
        if git rev-parse --quiet --verify HEAD~1 >/dev/null 2>&1 \
           && git diff --name-only HEAD~1 HEAD | grep -qx 'version.txt'; then
          VERSION=$(tr -d '[:space:]' < version.txt)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "release commit — tagging image as ${VERSION}"
        else
          echo "version=" >> "$GITHUB_OUTPUT"
          echo "not a release commit — no semver tag"
        fi
