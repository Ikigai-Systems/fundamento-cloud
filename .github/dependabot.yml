version: 2

# Every ecosystem prefixes its commits with `deps`, which release-please-config.json
# marks hidden — so dependency bumps never reach CHANGELOG.md. Bot pull requests are
# also skipped by .github/workflows/changelog.yml.
updates:
  - package-ecosystem: bundler
    commit-message:
      prefix: deps
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      ruby-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    commit-message:
      prefix: deps
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Keep the React family bumping together so a partial bump can't create
      # an unresolvable peer-dependency conflict (react/react-dom ship in lockstep).
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      # Keep the whole ESLint toolchain bumping together — a lone plugin or a
      # partial monorepo bump breaks peer resolution (see PRs #56/#57/#60).
      eslint:
        patterns:
          - "eslint"
          - "@eslint/*"
          - "typescript-eslint"
          - "@typescript-eslint/*"
          - "@stylistic/*"
          - "eslint-plugin-*"
          - "@tanstack/eslint-plugin-*"
      npm-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # React 18 -> 19 is a deliberate, breaking migration, not an auto-merge.
      # Remove these entries when doing the React 19 upgrade.
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    commit-message:
      prefix: deps
    directory: "/micro-services/blocknote-converter"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      eslint:
        patterns:
          - "eslint"
          - "@eslint/*"
          - "typescript-eslint"
          - "@typescript-eslint/*"
          - "@stylistic/*"
          - "eslint-plugin-*"
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      converter-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    commit-message:
      prefix: deps
    directory: "/"
    schedule:
      interval: weekly
