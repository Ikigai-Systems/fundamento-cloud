version: 2

# Every ecosystem prefixes its commits with `deps`, which release-please-config.json
# marks hidden — so dependency bumps never reach CHANGELOG.md. Bot pull requests are
# also skipped by .github/workflows/changelog.yml.
updates:
  - package-ecosystem: bundler
    commit-message:
      prefix: deps
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      ruby-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # The Gemfile pins tailwindcss-ruby to the Tailwind 3 CLI on purpose. Tailwind 4
      # drops config/tailwind.config.js for CSS-first config, so `theme(colors...)`
      # lookups no longer resolve and the CSS build fails (see PR #371). Remove this
      # entry when doing the Tailwind 4 migration.
      - dependency-name: "tailwindcss-ruby"
        update-types: ["version-update:semver-major"]
      # tailwindcss-rails 4 depends on tailwindcss-ruby 4, so it is the same migration
      # and would otherwise come back as its own PR (see PR #472).
      - dependency-name: "tailwindcss-rails"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    commit-message:
      prefix: deps
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Keep the React family bumping together so a partial bump can't create
      # an unresolvable peer-dependency conflict (react/react-dom ship in lockstep).
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      # Keep the whole ESLint toolchain bumping together — a lone plugin or a
      # partial monorepo bump breaks peer resolution (see PRs #56/#57/#60).
      eslint:
        patterns:
          - "eslint"
          - "@eslint/*"
          - "typescript-eslint"
          - "@typescript-eslint/*"
          - "@stylistic/*"
          - "eslint-plugin-*"
          - "@tanstack/eslint-plugin-*"
      npm-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # posthog-js 1.453.3 and 1.454.2 break the document and table comments and reactions
      # E2E specs: the page's comment and reaction requests stop firing (1.450.0 is fine,
      # releases in between are untested; see PR #543). Remove this entry once the cause
      # is found or a release passes `document-comments`, `document-reactions` and
      # `table-reactions`.
      - dependency-name: "posthog-js"
      # prosemirror-view 1.43.1 fails the "starts a comment on selected words when editing"
      # spec in `document-block-comments` on CI (1.42.9 is fine; see PR #548). It passed
      # locally, so only CI shows it. Remove this entry once a release passes that spec.
      - dependency-name: "prosemirror-view"
      # React 18 -> 19 is a deliberate, breaking migration, not an auto-merge.
      # Remove these entries when doing the React 19 upgrade.
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
      # @mantine/core 9 peers react ^19.2.0, so it is part of the React 19
      # migration above, not a bump of its own (see PR #151).
      - dependency-name: "@mantine/*"
        update-types: ["version-update:semver-major"]
      # typescript-eslint 8.70.0 -- the newest release, alphas included -- peers
      # typescript ">=4.8.4 <6.1.0". TypeScript 7 cannot install alongside it
      # (see PR #127). Remove this once typescript-eslint widens that range.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    commit-message:
      prefix: deps
    directory: "/micro-services/blocknote-converter"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      eslint:
        patterns:
          - "eslint"
          - "@eslint/*"
          - "typescript-eslint"
          - "@typescript-eslint/*"
          - "@stylistic/*"
          - "eslint-plugin-*"
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      converter-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Same typescript-eslint peer ceiling as the root project above.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    commit-message:
      prefix: deps
    directory: "/"
    schedule:
      interval: weekly
    # Actions are pinned to commit SHAs; Dependabot bumps the SHA and its version comment.
    # A week's wait means a hijacked release is usually caught before it is proposed here.
    cooldown:
      default-days: 7
