name: Run E2E Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:
    inputs:
      debug_enabled:
        type: boolean
        description: 'Run the build with tmate debugging enabled (https://github.com/marketplace/actions/debugging-with-tmate)'
        required: false
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-e2e-tests:
    name: run-e2e-tests (${{ matrix.device }}${{ matrix.shard && format(' {0}/{1}', matrix.shard, matrix.shards) || '' }})
    runs-on: ubuntu-latest
    # A normal desktop shard takes about 7 minutes. Without a limit a hung step runs to
    # GitHub's 6-hour default.
    timeout-minutes: 45
    if: "!contains(github.event.head_commit.message, '[skip-tests]')"

    # Each device gets its own runner and environment, so they run side by side.
    # Profiles live in spec/e2e/cypress/support/devices.cjs.
    #
    # Desktop runs the whole suite, split by cypress-split into shards of equal duration; on
    # one runner it took ~13 minutes of the job's ~17. The base matrix makes the desktop
    # shards; the `desktop` include adds its settings to each of them, and the other devices,
    # matching no base combination, become jobs of their own.
    strategy:
      fail-fast: false
      matrix:
        device: [desktop]
        shard: [1, 2, 3, 4]
        include:
          - device: desktop
            shards: 4  # keep in step with `shard` above
            expose: device=desktop
            results: tmp/cypress-results-*.xml
            fail_on_failure: true
          # The touch specs gate the build like the desktop suite: a phone regression fails CI.
          # Both touch jobs also crawl every page (~45s each), so a control too small to tap,
          # hidden from a finger or overflowing the screen fails the build.
          - device: phone
            spec: spec/e2e/cypress/e2e/devices/**/*.cy.js
            expose: device=phone,crawl=true
            results: tmp/cypress-phone-results-*.xml
            fail_on_failure: true
          # The desktop layout driven by touch: where controls built for a mouse meet a finger
          - device: tablet-landscape
            spec: spec/e2e/cypress/e2e/devices/**/*.cy.js
            expose: device=tablet-landscape,crawl=true
            results: tmp/cypress-tablet-landscape-results-*.xml
            fail_on_failure: true

    permissions:
      contents: read
      checks: write  # Required for mikepenz/action-junit-report
      packages: write  # Required to push/pull the build cache image on GHCR

    env:
      RAILS_ENV: e2e
      DATABASE_URL: postgres://postgres:password@localhost/postgres
      # Names the job's artifacts and report check: every leg uploads, and a repeated
      # artifact name fails.
      LEG: ${{ matrix.device }}${{ matrix.shard && format('-{0}', matrix.shard) || '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup SOPS with age
        uses: ./.github/actions/setup-sops
        with:
          age-key: ${{ secrets.SOPS_AGE_KEY }}

      - name: Decrypt and export secrets
        run: |
          # Decrypt into variables FIRST so a missing/invalid age key fails the step
          # loudly. Never wrap sops in `echo "$(...)"` — echo exits 0 and swallows
          # sops's non-zero exit, silently continuing with empty secrets.
          RAILS_MASTER_KEY=$(sops -d --extract '["rails"]["master_key"]' config/secrets/e2e.sops.yaml)

          # Values derived from secrets aren't masked automatically, and these logs are public.
          echo "::add-mask::${RAILS_MASTER_KEY}"
          echo "RAILS_MASTER_KEY=${RAILS_MASTER_KEY}" >> $GITHUB_ENV

      - name: Setup tmate session
        uses: mxschmitt/action-tmate@35b54afac29c97fb54faba5b513f8fbd1882f113 # v3.24
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_enabled }}
        with:
          detached: true
          # Only the person who started the run can connect; this repository is public.
          limit-access-to-actor: true

      # Removing the builder at the end of the job took 17-50 s, and the job isn't done
      # until it is. A hosted runner is discarded after the job anyway. A persistent
      # self-hosted runner would need the cleanup back, or its disk fills with builders.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cleanup: false

      # The build cache lives in GHCR rather than the Actions cache: a mode=max cache
      # for this image is ~10 GB, which alone exceeds the repo's 10 GB Actions cache
      # quota and would evict the npm/bundler caches the other workflows rely on.
      #
      # It is a tag on the existing (private) fundamento-cloud package, not a package
      # of its own, and must stay private: the cached layers hold the built app,
      # including the encrypted credentials files and the compiled assets, and a fresh
      # GHCR package is created *public*.
      - name: Log in to the Container registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".tool-versions"
          cache: "npm"

      - run: npm ci

      # Registry pulls (postgres/redis/minio) intermittently fail on GitHub-hosted
      # runners with a transient network/registry error, aborting the whole job
      # before Cypress ever runs. Pre-pull with retries so a flaky pull doesn't
      # waste the whole CI run; compose-action's later `up` reuses the cached images.
      - name: Pull external Docker images (with retry)
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          max_attempts: 3
          timeout_minutes: 5
          command: docker compose pull postgresql redis minio minio-initialization

      # Build the app images up front, reusing the previous run's layers. Without a
      # cache the `bundle install` layer is rebuilt cold every run. `up` below reuses
      # these images.
      - name: Build app images (with layer cache)
        run: docker compose build website  # `jobs` runs the same image
        env:
          BUILD_CACHE_FROM: type=registry,ref=ghcr.io/ikigai-systems/fundamento-cloud:e2e-buildcache
          # Master is the only writer, so the cache always reflects the merge base and
          # no branch can overwrite it with its own Gemfile.lock. Only the first desktop
          # shard writes: all legs build identical images, and concurrent ~10 GB exports
          # to one tag would only race. Note the expression order: `cond && '' || X`
          # would misfire, because an empty string is falsy in GitHub expressions and
          # would always yield X.
          BUILD_CACHE_TO: ${{ github.ref == 'refs/heads/master' && matrix.device == 'desktop' && matrix.shard == 1 && 'type=registry,ref=ghcr.io/ikigai-systems/fundamento-cloud:e2e-buildcache,mode=max,ignore-error=true' || '' }}

      - uses: hoverkraft-tech/compose-action@b659c744ee9bed25aea2307c017ad849bd104433 # v3.2.0
        env:
          RAILS_MASTER_KEY: ${{ env.RAILS_MASTER_KEY }}

      # Spec durations from the latest run, kept by the merge-e2e-timings job below. A PR
      # finds its own branch's first, then master's. With none, cypress-split splits by name.
      - name: Restore spec timings
        if: matrix.shard
        uses: actions/cache/restore@v6
        with:
          path: tmp/e2e-timings.json
          key: e2e-timings-${{ github.run_id }}
          restore-keys: e2e-timings-

      - name: Cypress run
        uses: cypress-io/github-action@c541a95ea92d9239347a2355f2e895cd4b3f8060 # v7.4.6
        with:
          project: ./spec/e2e
          install: false # already installed by `npm ci`
          wait-on: http://localhost:3000
          config: baseUrl=http://localhost:3000
          spec: ${{ matrix.spec }}
          expose: ${{ matrix.expose }}
        env:
          DEBUG: "@cypress/github-action"
          # cypress-split (spec/e2e/cypress.config.cjs); empty outside the desktop shards.
          # SPLIT_FILE must be relative: it is looked up from the working directory upwards,
          # and an absolute path is never found, silently splitting by name instead.
          SPLIT: ${{ matrix.shards }}
          SPLIT_INDEX1: ${{ matrix.shard }}
          SPLIT_FILE: ${{ matrix.shard && 'tmp/e2e-timings.json' || '' }}
          SPLIT_OUTPUT_FILE: ${{ matrix.shard && format('{0}/tmp/e2e-timings-shard.json', github.workspace) || '' }}
        continue-on-error: true  # Allow workflow to continue to publish results

      - name: Dump app container logs
        if: always()
        run: docker compose logs --no-color website jobs > log/docker-compose-app.log

      - name: Upload app container logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: docker-compose-app-logs-${{ env.LEG }}
          path: log/docker-compose-app.log
          retention-days: 7

      - name: Upload spec timings
        if: always() && matrix.shard
        uses: actions/upload-artifact@v7
        with:
          name: e2e-timings-${{ env.LEG }}
          path: tmp/e2e-timings-shard.json
          retention-days: 1
          if-no-files-found: warn

      - name: Upload E2E test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cypress-results-${{ env.LEG }}
          path: ${{ matrix.results }}
          retention-days: 30
          if-no-files-found: error

      - name: Publish E2E test report
        if: always()
        uses: mikepenz/action-junit-report@6ef3fdcfcd5f0b5d14df3e659ef19b8c6820f93d # v6.6.1
        with:
          report_paths: ${{ matrix.results }}
          check_name: Cypress Test Results (${{ env.LEG }})
          summary: true
          detailed_summary: true
          annotate_only: false
          fail_on_failure: ${{ matrix.fail_on_failure }}
          # A cancelled or hung run leaves no report, and the action would otherwise post
          # a passing check for it.
          require_tests: true
          fail_on_parse_error: true

      # A report-only leg never fails the job, so it uploads its failure screenshots and
      # videos regardless; Cypress writes them only for failed tests anyway.
      - name: Upload screenshots on failure
        if: failure() || !matrix.fail_on_failure
        uses: actions/upload-artifact@v7
        with:
          name: cypress-screenshots-${{ env.LEG }}
          path: log/cypress/screenshots
          retention-days: 7  # Shorter retention for debug artifacts
          if-no-files-found: warn

      - name: Upload videos on failure
        if: failure() || !matrix.fail_on_failure
        uses: actions/upload-artifact@v7
        with:
          name: cypress-videos-${{ env.LEG }}
          path: log/cypress/videos
          retention-days: 7  # Shorter retention for debug artifacts
          if-no-files-found: warn

  # Merges the shards' spec timings, and the previous ones, into the cache the next run
  # splits by. cypress-split-merge averages a spec found in several files, which also evens
  # out a run on a slow runner. Saved from every branch: a PR's cache is visible only to
  # that PR, so master's stays its own.
  merge-e2e-timings:
    needs: run-e2e-tests
    if: ${{ !cancelled() && needs.run-e2e-tests.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".tool-versions"
          cache: "npm"

      - run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: 0  # only cypress-split-merge is needed

      - name: Restore previous spec timings
        uses: actions/cache/restore@v6
        with:
          path: tmp/e2e-timings.json
          key: e2e-timings-${{ github.run_id }}
          restore-keys: e2e-timings-

      - name: Download shard timings
        uses: actions/download-artifact@v8
        with:
          pattern: e2e-timings-*
          path: tmp/timings

      # The previous timings join the merge as one more file of the same name. When no
      # shard got as far as writing timings, the previous ones are saved again as they are.
      - name: Merge spec timings
        run: |
          if ! find tmp/timings -name e2e-timings-shard.json 2>/dev/null | grep -q .; then
            echo "No shard wrote spec timings; keeping the previous ones."
            exit 0
          fi
          if [ -f tmp/e2e-timings.json ]; then
            mkdir -p tmp/timings/previous
            mv tmp/e2e-timings.json tmp/timings/previous/e2e-timings-shard.json
          fi
          npx cypress-split-merge --parent-folder tmp/timings --split-file e2e-timings-shard.json --output tmp/e2e-timings.json

      - name: Save spec timings
        if: hashFiles('tmp/e2e-timings.json') != ''
        uses: actions/cache/save@v6
        with:
          path: tmp/e2e-timings.json
          key: e2e-timings-${{ github.run_id }}-${{ github.run_attempt }}
