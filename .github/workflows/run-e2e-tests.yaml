name: Run E2E Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:
    inputs:
      debug_enabled:
        type: boolean
        description: 'Run the build with tmate debugging enabled (https://github.com/marketplace/actions/debugging-with-tmate)'
        required: false
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-e2e-tests:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip-tests]')"

    permissions:
      contents: read
      checks: write  # Required for mikepenz/action-junit-report

    env:
      RAILS_ENV: e2e
      DATABASE_URL: postgres://postgres:password@localhost/postgres

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup SOPS with age
        uses: ./.github/actions/setup-sops
        with:
          age-key: ${{ secrets.SOPS_AGE_KEY }}

      - name: Decrypt and export secrets
        run: |
          # Decrypt into variables FIRST so a missing/invalid age key fails the step
          # loudly. Never wrap sops in `echo "$(...)"` — echo exits 0 and swallows
          # sops's non-zero exit, silently continuing with empty secrets.
          FONTAWESOME_TOKEN=$(sops -d --extract '["fontawesome"]["auth_token"]' config/secrets/build.sops.yaml)
          RAILS_MASTER_KEY=$(sops -d --extract '["rails"]["master_key"]' config/secrets/e2e.sops.yaml)

          echo "BUNDLE_DL__FONTAWESOME__COM=${FONTAWESOME_TOKEN}" >> $GITHUB_ENV
          echo "RAILS_MASTER_KEY=${RAILS_MASTER_KEY}" >> $GITHUB_ENV

          # FontAwesome token: env var for bundle install + secret file for Docker build.
          # Use printf (not echo) for the secret file: the Docker build injects the file
          # verbatim as BUNDLE_DL__FONTAWESOME__COM via --mount=type=secret,env=..., and a
          # trailing newline in the credential makes Bundler 4 fail with "Please CGI escape
          # your usernames and passwords" (exit 17).          
          printf '%s' "${FONTAWESOME_TOKEN}" > dockerfiles/fontawesome-auth.secret
          chmod 600 dockerfiles/fontawesome-auth.secret

      - name: Setup tmate session
        uses: mxschmitt/action-tmate@v3
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_enabled }}
        with:
          detached: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # buildx's `type=gha` cache backend reads ACTIONS_CACHE_URL and
      # ACTIONS_RUNTIME_TOKEN from the environment. docker/build-push-action injects
      # them on its own, but a plain `docker compose build` does not -- without this
      # step the cache silently no-ops and every run re-downloads every gem.
      - name: Expose GitHub Actions runtime for the build cache
        uses: crazy-max/ghaction-github-runtime@v3

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".tool-versions"
          cache: "npm"

      - run: npm ci

      # Registry pulls (postgres/redis/minio) intermittently fail on GitHub-hosted
      # runners with a transient network/registry error, aborting the whole job
      # before Cypress ever runs. Pre-pull with retries so a flaky pull doesn't
      # waste the whole CI run; compose-action's later `up` reuses the cached images.
      - name: Pull external Docker images (with retry)
        uses: nick-fields/retry@v4
        with:
          max_attempts: 3
          timeout_minutes: 5
          command: docker compose pull postgresql redis minio minio-initialization

      # Build the app images up front, reusing the previous run's layers. Without a
      # cache the `bundle install` layer is rebuilt cold every run, which re-downloads
      # the 17 MB font-awesome-pro-sass gem from dl.fontawesome.com -- ~4.9 GB/month
      # against a 2 GB Font Awesome bandwidth quota. `up` below reuses these images.
      - name: Build app images (with layer cache)
        run: docker compose build website jobs
        env:
          BUILD_CACHE_FROM: type=gha,scope=e2e
          BUILD_CACHE_TO: type=gha,mode=max,scope=e2e

      - uses: hoverkraft-tech/compose-action@v3.1.0
        env:
          RAILS_MASTER_KEY: ${{ env.RAILS_MASTER_KEY }}

      - name: Cypress run
        uses: cypress-io/github-action@v7
        with:
          project: ./spec/e2e
          install: false # already installed by `npm ci`
          wait-on: http://localhost:3000
          config: baseUrl=http://localhost:3000
        env:
          DEBUG: "@cypress/github-action"
        continue-on-error: true  # Allow workflow to continue to publish results

      - name: Dump app container logs
        if: always()
        run: docker compose logs --no-color website jobs > log/docker-compose-app.log

      - name: Upload app container logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: docker-compose-app-logs
          path: log/docker-compose-app.log
          retention-days: 7

      - name: Upload E2E test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cypress-results
          path: tmp/cypress-results-*.xml
          retention-days: 30
          if-no-files-found: error

      - name: Publish E2E test report
        if: always()
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: 'tmp/cypress-results-*.xml'
          check_name: Cypress E2E Test Results
          summary: true
          detailed_summary: true
          annotate_only: false
          fail_on_failure: true

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cypress-screenshots
          path: log/cypress/screenshots
          retention-days: 7  # Shorter retention for debug artifacts
          if-no-files-found: warn

      - name: Upload videos on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cypress-videos
          path: log/cypress/videos
          retention-days: 7  # Shorter retention for debug artifacts
          if-no-files-found: warn
