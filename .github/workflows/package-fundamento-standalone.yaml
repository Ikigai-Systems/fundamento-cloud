name: "Package: fundamento-standalone"

on:
  workflow_run:
    workflows: [ "Run Tests" ]
    types:
      - completed
    branches:
      - master
  # `branches` matches the head branch name only, so a pull request from a fork's own `master`
  # also triggers this. The jobs check that the tests ran for a push to this repository.

jobs:
  # Whether this change may skip the deploy comes from its changed paths: see .github/actions/ci-labels.
  decide:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository && (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'skipped')
    permissions:
      contents: read
      pull-requests: read
      statuses: read
    outputs:
      skip_deploy: ${{ steps.decide.outputs.skip_deploy }}
    steps:
      - uses: actions/checkout@v7

      - id: decide
        uses: ./.github/actions/ci-labels
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

  # One publish at a time. create-multi-arch-manifest assembles `latest` from the `latest-amd64` and
  # `latest-arm64` tags, so overlapping runs could pair two commits in one manifest, or leave
  # `latest` on the older build. Queued like the cloud deploy: a running publish is never
  # cancelled, only the newest waiting one is kept, and runs that skip publishing never reach the
  # group, so they can't take the waiting slot.
  publish:
    needs: decide
    if: needs.decide.outputs.skip_deploy != 'true'
    uses: ./.github/workflows/publish-standalone.yaml
    secrets: inherit
    permissions:
      contents: read
      packages: write
    concurrency:
      group: standalone-publish
      cancel-in-progress: false
