name: "Package: fundamento-cloud"

on:
  workflow_run:
    workflows: [ "Run Tests" ]
    types:
      - completed
    branches:
      - master
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  SOPS_VERSION: 3.11.0
  NODE_MAJOR: 24

jobs:
  build-and-push-images:
    runs-on: ubuntu-latest
    if: ${{ (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'skipped') && !contains(github.event.workflow_run.head_commit.message, '[skip-deploy]') }}
    strategy:
      matrix:
        include:
          - image-name: fundamento-cloud
            context: .
            needs-secrets: true
            rails-env: production
            build-target: production
          - image-name: blocknote-converter
            context: micro-services/blocknote-converter
            needs-secrets: false
            rails-env: ''
            build-target: ''
    permissions:
      contents: read
      packages: write
      id-token: write # assume the AWS ECS deploy role via OIDC
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup SOPS with age
        if: matrix.needs-secrets
        uses: ./.github/actions/setup-sops
        with:
          age-key: ${{ secrets.SOPS_AGE_KEY }}
          sops-version: ${{ env.SOPS_VERSION }}

      - name: Decrypt secrets for Docker build
        if: matrix.needs-secrets
        run: |
          sops -d --extract '["fontawesome"]["auth_token"]' config/secrets/build.sops.yaml > /tmp/fontawesome-auth.secret
          echo "FONTAWESOME_SECRET_FILE=/tmp/fontawesome-auth.secret" >> $GITHUB_ENV

      - name: Docker build setup
        id: build-setup
        uses: ./.github/actions/docker-build-setup
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Tags for CI/CD consumption (FluxCD picks up timestamp tags)
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image-name }}
          tags: |
            type=raw,value=${{ steps.build-setup.outputs.timestamp }},enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NODE_MAJOR=${{ env.NODE_MAJOR }}
            ${{ matrix.rails-env && format('RAILS_ENV={0}', matrix.rails-env) || '' }}
          target: ${{ matrix.build-target || '' }}
          secret-files: |
            ${{ matrix.needs-secrets && format('"fontawesome-auth={0}"', env.FONTAWESOME_SECRET_FILE) || '' }}
          cache-from: |
            type=gha,scope=${{ matrix.image-name }}
            type=registry,ref=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image-name }}:master
          cache-to: type=gha,mode=max,scope=${{ matrix.image-name }}

      # Deploy the newly pushed fundamento-cloud image to ECS (website + jobs),
      # running DB migrations first. Only the fundamento-cloud image on master.
      - name: Configure AWS credentials
        if: matrix.image-name == 'fundamento-cloud' && github.event.workflow_run.head_branch == 'master'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::471112519766:role/prod-github-actions-ecs-deploy-role
          aws-region: us-east-1

      - name: Deploy to ECS
        if: matrix.image-name == 'fundamento-cloud' && github.event.workflow_run.head_branch == 'master'
        env:
          IMAGE_TAG: ${{ steps.build-setup.outputs.timestamp }}
        run: |
          set -euo pipefail
          # The timestamp may contain colons; docker/metadata-action sanitizes them
          # to dashes for the pushed tag, so match that here (else ECS can't
          # normalize the image reference).
          IMAGE_TAG="${IMAGE_TAG//:/-}"
          CLUSTER=prod-ecs

          # Register a new task-def revision for a service with the new image; prints the new ARN.
          register_new() {
            local full="prod-$1" container="$1" td cur new reg
            td=$(aws ecs describe-task-definition --task-definition "$full" --query 'taskDefinition')
            cur=$(jq -r --arg c "$container" '.containerDefinitions[]|select(.name==$c)|.image' <<<"$td")
            new="${cur%:*}:${IMAGE_TAG}"
            reg=$(jq --arg c "$container" --arg img "$new" \
              '.containerDefinitions |= map(if .name==$c then .image=$img else . end)
               | del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy)' <<<"$td")
            aws ecs register-task-definition --cli-input-json "$reg" --query 'taskDefinition.taskDefinitionArn' --output text
          }

          WEB_ARN=$(register_new fundamento-cloud-website)
          JOBS_ARN=$(register_new fundamento-cloud-jobs)
          echo "new website: $WEB_ARN"
          echo "new jobs:    $JOBS_ARN"

          # Run DB migrations with the NEW image (run-task) before shifting traffic.
          echo "Running db:migrate..."
          NETCFG=$(aws ecs describe-services --cluster "$CLUSTER" --services prod-fundamento-cloud-website --query 'services[0].networkConfiguration' --output json)
          OV=$(jq -nc '{containerOverrides:[{name:"fundamento-cloud-website",command:["bin/rails","db:migrate"]}]}')
          TASK=$(aws ecs run-task --cluster "$CLUSTER" --task-definition "$WEB_ARN" --launch-type FARGATE \
            --network-configuration "$NETCFG" --overrides "$OV" --query 'tasks[0].taskArn' --output text)
          aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$TASK"
          CODE=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK" \
            --query "tasks[0].containers[?name=='fundamento-cloud-website'].exitCode | [0]" --output text)
          [ "$CODE" = "0" ] || { echo "Migration failed (exit $CODE)"; exit 1; }
          echo "Migration OK"

          # Shift traffic: update both services to the new revisions.
          aws ecs update-service --cluster "$CLUSTER" --service prod-fundamento-cloud-website --task-definition "$WEB_ARN" >/dev/null
          aws ecs update-service --cluster "$CLUSTER" --service prod-fundamento-cloud-jobs --task-definition "$JOBS_ARN" >/dev/null
          aws ecs wait services-stable --cluster "$CLUSTER" --services prod-fundamento-cloud-website prod-fundamento-cloud-jobs
          echo "Deployed website + jobs"
