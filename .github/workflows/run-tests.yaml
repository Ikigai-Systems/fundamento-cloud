name: Run Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ "**" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  run-tests:
    runs-on: ubuntu-latest
    # A normal run takes 6-14 minutes. Without a limit a hung step runs to GitHub's
    # 6-hour default.
    timeout-minutes: 30
    if: "!contains(github.event.head_commit.message, '[skip-tests]')"

    permissions:
      contents: read
      checks: write

    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:password@localhost/postgres

    steps:
      # pandoc comes from its GitHub release rather than apt: the runner's Ubuntu mirror stalls
      # on the download often enough to time the job out before any test runs. The version
      # matches the production image (Debian trixie). A stalled attempt is cut off and retried.
      - name: Install dependencies
        shell: bash
        timeout-minutes: 5
        env:
          PANDOC_VERSION: 3.1.11.1
          PANDOC_SHA256: ab0ac0aa1c3f9b23243d14e43023e06cbce51a52420aba17d27bd0d9c28f73ac
        run: |
          deb="pandoc-${PANDOC_VERSION}-1-amd64.deb"
          curl -fsSL --retry 5 --retry-all-errors --connect-timeout 20 --speed-limit 100000 --speed-time 20 \
            -o "$RUNNER_TEMP/$deb" "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/${deb}"
          echo "${PANDOC_SHA256}  $RUNNER_TEMP/$deb" | sha256sum -c -
          sudo dpkg -i "$RUNNER_TEMP/$deb"
          pandoc --version | head -1

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup SOPS with age
        uses: ./.github/actions/setup-sops
        with:
          age-key: ${{ secrets.SOPS_AGE_KEY }}

      - name: Decrypt and export secrets
        run: |
          # Decrypt into variables FIRST so a missing/invalid age key fails the step
          # loudly. Never wrap sops in `echo "$(...)"` — echo exits 0 and swallows
          # sops's non-zero exit, silently continuing with empty secrets.
          FONTAWESOME_TOKEN=$(sops -d --extract '["fontawesome"]["auth_token"]' config/secrets/build.sops.yaml)
          RAILS_MASTER_KEY=$(sops -d --extract '["rails"]["master_key"]' config/secrets/test.sops.yaml)

          # Values derived from secrets aren't masked automatically, and these logs are public.
          echo "::add-mask::${FONTAWESOME_TOKEN}"
          echo "::add-mask::${RAILS_MASTER_KEY}"
          # dl.fontawesome.com takes the token as the basic-auth password; a bare value is
          # sent as the username and refused. The username is arbitrary.
          echo "BUNDLE_DL__FONTAWESOME__COM=fontawesome:${FONTAWESOME_TOKEN}" >> $GITHUB_ENV
          echo "RAILS_MASTER_KEY=${RAILS_MASTER_KEY}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: ruby/setup-ruby@26e5b7d197ebf60545ee9667bcbace0be11ccaec # v1.334.0
        with:
          bundler-cache: true

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".tool-versions"
          cache: "npm"

      # Test the blocknote-converter package
      - run: npm ci
        working-directory: micro-services/blocknote-converter
      - run: npm run test --if-present
        working-directory: micro-services/blocknote-converter
      - run: npm run build --if-present
        working-directory: micro-services/blocknote-converter

      # Install dependencies
      - run: npm ci
      - run: npm run build --if-present

      # Registry pulls intermittently fail on GitHub-hosted runners with a transient
      # network/registry error, aborting the whole job. Pre-pull with retries so a
      # flaky pull doesn't waste the whole CI run.
      - name: Pull external Docker images (with retry)
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          max_attempts: 3
          timeout_minutes: 5
          command: docker compose pull postgresql redis

      # Run rspec
      - uses: hoverkraft-tech/compose-action@b659c744ee9bed25aea2307c017ad849bd104433 # v3.2.0
        with:
          services: |
            postgresql
            redis

      - name: Setup the database
        run: bin/rails db:setup

      - name: Rebuild tailwind.css
        run: bin/rails test:prepare

      - name: Run specs
        run: |
          bin/rspec \
            --format progress \
            --format RspecJunitFormatter \
            --out tmp/rspec-results.xml
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rspec-results
          path: tmp/rspec-results.xml
          retention-days: 30

      - name: Publish test report
        if: always()
        uses: mikepenz/action-junit-report@6ef3fdcfcd5f0b5d14df3e659ef19b8c6820f93d # v6.6.1
        with:
          report_paths: tmp/rspec-results.xml
          check_name: RSpec Test Results
          summary: true
          detailed_summary: true
          annotate_only: false
          fail_on_failure: true
          # A cancelled or hung run leaves no report, and the action would otherwise post
          # a passing check for it.
          require_tests: true
          fail_on_parse_error: true